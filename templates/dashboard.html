<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Task Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="dashboard-header">

        <h1>Task Dashboard</h1>

        <button id="logoutBtn">
            Logout
        </button>

    </header>


    <main class="dashboard-container">

        <!-- Statistics -->

        <section class="stats-grid">

            <div class="stat-card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>In Progress</h3>
                <p id="inProgressTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>High Priority</h3>
                <p id="highPriorityTasks">0</p>
            </div>

        </section>


        <!-- Filters -->

        <section class="filters">

            <input
                type="text"
                id="searchInput"
                placeholder="Search tasks..."
            >


            <select id="statusFilter">

                <option value="">
                    All Status
                </option>

                <option value="pending">
                    Pending
                </option>

                <option value="in_progress">
                    In Progress
                </option>

                <option value="completed">
                    Completed
                </option>

            </select>


            <select id="priorityFilter">

                <option value="">
                    All Priority
                </option>

                <option value="low">
                    Low
                </option>

                <option value="medium">
                    Medium
                </option>

                <option value="high">
                    High
                </option>

            </select>


            <button id="filterBtn">
                Apply Filters
            </button>

        </section>


        <!-- Tasks -->

        <section class="tasks-section">

            <div class="tasks-header">

                <h2>My Tasks</h2>

                <button id="createTaskBtn">
                    + Create Task
                </button>

            </div>


            <div id="tasksContainer">

                <p>Loading tasks...</p>

            </div>

        </section>

    </main>


    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>

</html>
